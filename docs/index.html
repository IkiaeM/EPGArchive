<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPG Archive Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="header-content">
                <h1>📺 EPG Archive</h1>
                <p class="subtitle">Guide des programmes TV</p>
            </div>
            <div class="controls">
                <div class="date-nav">
                    <button id="prev-day" class="nav-btn" title="Jour précédent">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15,18 9,12 15,6"></polyline>
                        </svg>
                    </button>
                    <input type="date" id="date-picker" class="date-picker">
                    <button id="next-day" class="nav-btn" title="Jour suivant">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9,18 15,12 9,6"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="search-box">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="channel-search" placeholder="Rechercher une chaîne..." class="search-input">
                </div>
            </div>
        </header>

        <div class="main-container">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>Chaînes</h2>
                    <span id="channel-count" class="channel-count">0</span>
                </div>
                <div id="channel-list" class="channel-list">
                    <div class="loading">Chargement...</div>
                </div>
            </aside>

            <main class="content">
                <div class="time-header" id="time-header"></div>
                <div id="epg-grid" class="epg-grid">
                    <div class="loading-overlay" id="loading">
                        <div class="spinner"></div>
                        <p>Chargement des programmes...</p>
                    </div>
                </div>
            </main>
        </div>

        <div id="modal" class="modal">
            <div class="modal-content">
                <button class="modal-close" id="modal-close">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <div class="modal-header">
                    <img id="modal-icon" class="modal-icon" src="" alt="">
                    <div class="modal-title-section">
                        <h2 id="modal-title"></h2>
                        <p id="modal-channel" class="modal-channel"></p>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="modal-meta">
                        <span id="modal-time" class="modal-time"></span>
                        <span id="modal-category" class="modal-category"></span>
                    </div>
                    <p id="modal-description" class="modal-description"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
