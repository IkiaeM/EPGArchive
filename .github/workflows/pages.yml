name: Deploy EPG Viewer to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - 'archive/**'
      - 'docs/**'
  repository_dispatch:
    types: [epg-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate dates index
        run: python docs/generate_index.py

      - name: Prepare Pages directory
        run: |
          mkdir -p _site
          cp -r docs/* _site/
          cp -r archive _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
